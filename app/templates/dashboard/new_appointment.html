{% extends "dashboard/base.html" %}{% block title %}Novo agendamento | Prime{% endblock %}{% block dashboard_content %}<div class="page-heading"><div><span class="eyebrow">ATENDIMENTO MANUAL</span><h1>Novo agendamento</h1><p class="muted">Use “encaixe” quando quiser colocar um cliente fora da grade normal.</p></div></div><div class="panel form-panel"><form class="stack-form" method="post"><label>Cliente<select name="client_user_id" required><option value="">Selecione</option>{% for c in clients %}<option value="{{c.id}}">{{c.name}} — {{c.phone}}</option>{% endfor %}</select></label><label>Profissional<select name="professional_id" required>{% for p in professionals %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select></label><label>Serviço<select name="service_id" required>{% for s in services %}<option value="{{s.id}}">{{s.name}} · {{s.duration}} min</option>{% endfor %}</select></label><div class="two-fields"><label>Data<input type="date" name="date" min="{{today.isoformat()}}" required></label><label>Horário<input type="time" name="start_time" required></label></div><label class="check"><input type="checkbox" name="is_encaixe"> Permitir como encaixe (fora da grade normal)</label><label>Observação<textarea name="notes" rows="4" placeholder="Observação interna..."></textarea></label><button class="btn" type="submit">Criar agendamento</button></form></div>{% endblock %}
